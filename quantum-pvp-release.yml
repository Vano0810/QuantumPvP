# Положите этот файл в репозиторий мода Quantum PvP как .github/workflows/release.yml.
# Тег vX.Y.Z -> сборка jar -> релиз. Лаунчер сам найдёт jar и предложит обновление.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: chmod +x gradlew && ./gradlew build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
